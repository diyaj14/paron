server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      routes:

        # ── User-facing routes (auth required by AuthFilter) ────────────────

        # Token history for a user
        - id: token-history
          uri: ${TOKEN_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/tokens/history/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1

        # Ledger balance for a user
        - id: ledger-balance
          uri: ${LEDGER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/ledger/balance/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1

        # Sync endpoints (manual trigger + status check)
        - id: sync
          uri: ${SYNC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/sync/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1

        # Fraud alerts (list + review)
        - id: fraud-alerts
          uri: ${FRAUD_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/fraud/alerts/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 30
                redis-rate-limiter.requestedTokens: 1

        # ── Internal-only endpoints: intentionally NOT routed ───────────────
        # POST /api/v1/tokens/gettoken, /validateToken, /mark-used
        # POST /api/v1/ledger/reserve, /release, /settle
        # POST /api/v1/fraud/check
        # No route defined => gateway returns 404 to external callers.
        # Services call each other directly over HTTP.

        # ── Actuator passthrough for each backend service ───────────────────
        - id: actuator-token
          uri: ${TOKEN_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/actuator/token-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: actuator-ledger
          uri: ${LEDGER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/actuator/ledger-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: actuator-sync
          uri: ${SYNC_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/actuator/sync-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        - id: actuator-fraud
          uri: ${FRAUD_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/actuator/fraud-service/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

      # ─── Global CORS (single origin for the mobile app / POS) ─────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: GET,POST,PUT,DELETE
            allowed-headers: Authorization,Content-Type,X-Requested-With
            exposed-headers: X-User-Id
            allow-credentials: true
            max-age: 3600

  # ─── Redis (Upstash free tier, or local docker-compose) ──────────────────
  # Backing store for the token-bucket RequestRateLimiter. Same env-var
  # conventions as the other services (fraud-service uses these too).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

# ─── User session JWT (RS256) ─────────────────────────────────────────────
# AuthFilter verifies the signature against this public key. The private key
# is held by the (future) auth service that issues user session JWTs.
# Supply a PEM "BEGIN PUBLIC KEY" blob, e.g.:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   openssl rsa -in private.pem -pubout -out public.pem
# then set JWT_PUBLIC_KEY to the contents of public.pem (with \n escapes).
gateway:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:}

# ─── Actuator (gateway's own health endpoint) ─────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ─── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    org.paron.apigateway: DEBUG
    org.springframework.cloud.gateway: INFO
