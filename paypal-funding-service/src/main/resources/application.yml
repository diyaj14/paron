server:
  port: 8085
spring:
  application:
    name: paypal-funding-service
  # Load SUPABASE_*/CLIENT_* from the repo .env (spring-dotenv 4.0.0 is broken on Boot 4).
  # Two candidates: repo root (./.env) and paypal-funding-service/ for mvn spring-boot:run (../.env).
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:6543/${SUPABASE_DB}?sslmode=require&connect_timeout=90&tcpKeepAlive=true&prepareThreshold=0
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  # CLIENT_ID/CLIENT_SECRET are accepted for a local PayPal sandbox .env;
  # use the explicit PAYPAL_* names in shared or deployed environments.
  client-id: ${PAYPAL_CLIENT_ID:${CLIENT_ID:}}
  client-secret: ${PAYPAL_CLIENT_SECRET:${CLIENT_SECRET:}}
  currency: ${PAYPAL_CURRENCY:USD}
  maximum-amount: ${PAYPAL_MAXIMUM_AMOUNT:500.00}
ledger:
  base-url: ${LEDGER_SERVICE_URL:http://localhost:8082}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
management:
  endpoints.web.exposure.include: health,info

  datasource:
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000
