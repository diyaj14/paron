server:
  port: 8082

spring:
  application:
    name: ledger-service

  # Same Supabase project as token-service, different tables (accounts, reservations)
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:5432/${SUPABASE_DB}
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.offlinepay.ledger: DEBUG
