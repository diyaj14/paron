server:
  port: 8082

spring:
  application:
    name: ledger-service

  # Load SUPABASE_* from the repo .env. spring-dotenv 4.0.0 is binary-incompatible
  # with Boot 4 (ConfigurableBootstrapContext moved packages), so it never fires.
  # Two candidates cover both working directories: repo root (./.env) and
  # ledger-service/ when running mvn spring-boot:run (../.env).
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"

  # Same Supabase project as token-service, different tables (accounts, reservations)
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:6543/${SUPABASE_DB}?sslmode=require&connect_timeout=90&tcpKeepAlive=true&prepareThreshold=0
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

ledger:
  # Hard per-user cap: total amount a single user may hold in ACTIVE
  # reservations (offline tokens) at any one time.
  max-active-reserved: 500.00

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.offlinepay.ledger: DEBUG
