# ─────────────────────────────────────────────────────────────────────────────
# Local infrastructure for OfflinePay development.
#
# Runs exactly two things that must exist before any service boots:
#   1. Kafka  (defaults: localhost:9092, PLAINTEXT, SASL/Upstash optional)
#   2. Redis  (defaults: localhost:6379, no password, SSL off)
#
# Supabase Postgres is NOT included — it's hosted and configured via .env.
#
# Usage:
#   docker compose up -d            # start Kafka + Redis
#   docker compose ps               # wait until both show "healthy"
#   docker compose logs -f kafka    # tail broker logs
#   docker compose down             # stop (keeps redis-data volume)
#   docker compose down -v          # stop AND wipe the Redis volume
#
# The Spring services on the host connect via the published ports:
#   spring.kafka.bootstrap-servers = localhost:9092
#   spring.data.redis.host/port    = localhost:6379
# No KAFKA_* / REDIS_* env vars needed — the services' localhost defaults match.
# ─────────────────────────────────────────────────────────────────────────────

services:

  kafka:
    image: apache/kafka:4.0.2
    container_name: offlinepay-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: single node is both controller and broker (no Zookeeper).
      # KAFKA_<KEY> env vars map directly to server.properties.
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      # Listeners: 9092 is the host-facing broker port, 9093 is the
      # internal controller-only listener (not exposed to the host).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Dev convenience: auto-create the "offline.transactions" topic on first write.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Single-broker cluster must use replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: offlinepay-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
