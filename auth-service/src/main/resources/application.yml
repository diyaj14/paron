server:
  port: 8086

spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST}:6543/${SUPABASE_DB}?sslmode=require&connect_timeout=90&tcpKeepAlive=true&prepareThreshold=0
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
auth:
  issuer: ${SESSION_JWT_ISSUER:paron-demo-auth}
  audience: ${SESSION_JWT_AUDIENCE:paron-wallet}
  private-key: ${SESSION_JWT_PRIVATE_KEY:}
  demo:
    username: ${DEMO_AUTH_USERNAME:}
    password: ${DEMO_AUTH_PASSWORD:}
    token-ttl-minutes: ${DEMO_AUTH_TOKEN_TTL_MINUTES:30}
